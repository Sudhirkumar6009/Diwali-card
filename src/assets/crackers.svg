<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- Anar Pot Gradient -->
    <linearGradient id="anarGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#FF5722"/>
      <stop offset="50%" stopColor="#E64A19"/>
      <stop offset="100%" stopColor="#BF360C"/>
    </linearGradient>
    <linearGradient id="goldDeco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#FFE082"/>
      <stop offset="50%" stopColor="#FFD54F"/>
      <stop offset="100%" stopColor="#FF8F00"/>
    </linearGradient>
    <!-- Rocket Cylinder Gradient -->
    <linearGradient id="rocketGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#D50000"/>
      <stop offset="40%" stopColor="#FF1744"/>
      <stop offset="100%" stopColor="#880E4F"/>
    </linearGradient>
    <!-- Chakri Gradient -->
    <radialGradient id="chakriGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#FFD700"/>
      <stop offset="45%" stopColor="#00E676"/>
      <stop offset="75%" stopColor="#00B0FF"/>
      <stop offset="100%" stopColor="#D500F9"/>
    </radialGradient>
    <!-- Sparkler Glow -->
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#FFFFFF"/>
      <stop offset="40%" stopColor="#FFF59D"/>
      <stop offset="80%" stopColor="#FFB300" stop-opacity="0.6"/>
      <stop offset="100%" stopColor="#FF8F00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. Background Aura Glow -->
  <circle cx="160" cy="180" r="110" fill="url(#sparkGlow)" opacity="0.35"/>

  <!-- 2. ANAR (Flowerpot Cracker) in center -->
  <g transform="translate(110, 150)">
    <!-- Conical Base -->
    <path d="M50 120 L15 120 L28 40 L37 40 Z" fill="url(#anarGrad)" stroke="#FFD54F" stroke-width="1.5"/>
    <!-- Gold bands -->
    <path d="M22 80 L43 80 L46 95 L19 95 Z" fill="url(#goldDeco)"/>
    <ellipse cx="32.5" cy="40" rx="4.5" ry="2.5" fill="#FFC107"/>
    <!-- Festive sparkles erupting from anar top -->
    <path d="M32 38 Q32 10 32 -15" stroke="#FFE082" stroke-width="2" stroke-linecap="round"/>
    <path d="M32 38 Q20 18 10 -5" stroke="#FFD54F" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M32 38 Q44 18 55 -5" stroke="#FFD54F" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M32 38 Q12 25 -5 10" stroke="#FF9800" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M32 38 Q52 25 70 10" stroke="#FF9800" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Golden Ember Stars -->
    <circle cx="32" cy="-18" r="3" fill="#FFFFFF"/>
    <circle cx="9" cy="-7" r="2.5" fill="#FFF9C4"/>
    <circle cx="56" cy="-7" r="2.5" fill="#FFF9C4"/>
    <circle cx="-6" cy="9" r="2" fill="#FFE082"/>
    <circle cx="71" cy="9" r="2" fill="#FFE082"/>
    <circle cx="20" cy="8" r="1.8" fill="#FFFFFF"/>
    <circle cx="45" cy="8" r="1.8" fill="#FFFFFF"/>
  </g>

  <!-- 3. ROCKET (Sky Shot Cracker) angled on left -->
  <g transform="translate(50, 100) rotate(-22)">
    <!-- Wooden Stick -->
    <line x1="20" y1="80" x2="20" y2="190" stroke="#8D6E63" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Rocket Tube -->
    <rect x="12" y="55" width="16" height="50" rx="3" fill="url(#rocketGrad)" stroke="#FFD54F" stroke-width="1"/>
    <!-- Golden Pattern on Tube -->
    <rect x="12" y="70" width="16" height="12" fill="url(#goldDeco)"/>
    <!-- Nose Cone -->
    <polygon points="20,25 9,55 31,55" fill="#FFC107" stroke="#FFA000" stroke-width="1"/>
    <!-- Fuse with spark -->
    <path d="M20 105 Q18 120 12 125" fill="none" stroke="#ECEFF1" stroke-width="1.5"/>
    <circle cx="12" cy="125" r="2" fill="#FFD54F"/>
  </g>

  <!-- 4. CHAKRI (Ground Spinner) on right -->
  <g transform="translate(225, 220)">
    <circle cx="0" cy="0" r="32" fill="url(#chakriGrad)"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4,3"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#FFD700" stroke-width="2"/>
    <circle cx="0" cy="0" r="9" fill="#D50000"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    <!-- Whirling spark dots -->
    <circle cx="-36" cy="-8" r="2.2" fill="#00E676"/>
    <circle cx="34" cy="12" r="2.2" fill="#FFD700"/>
    <circle cx="-14" cy="34" r="2.2" fill="#00B0FF"/>
    <circle cx="16" cy="-33" r="2.2" fill="#FF1744"/>
  </g>

  <!-- 5. PHULJHADI (Sparklers) crossing on left/top -->
  <g transform="translate(90, 60) rotate(35)">
    <!-- Metal Wire -->
    <line x1="0" y1="120" x2="0" y2="0" stroke="#B0BEC5" stroke-width="2" stroke-linecap="round"/>
    <!-- Chemical Coating -->
    <line x1="0" y1="75" x2="0" y2="5" stroke="#78909C" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Sparkling Tip -->
    <circle cx="0" cy="4" r="5" fill="#FFFFFF"/>
    <line x1="0" y1="4" x2="-14" y2="-10" stroke="#FFF59D" stroke-width="1.5"/>
    <line x1="0" y1="4" x2="15" y2="-8" stroke="#FFE082" stroke-width="1.5"/>
    <line x1="0" y1="4" x2="-8" y2="16" stroke="#FFD54F" stroke-width="1.5"/>
    <line x1="0" y1="4" x2="12" y2="14" stroke="#FFF59D" stroke-width="1.5"/>
    <line x1="0" y1="4" x2="0" y2="-16" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>

  <!-- 6. Scattered Festive Sparkles & Confetti -->
  <circle cx="65" cy="180" r="3" fill="#FFD700"/>
  <circle cx="260" cy="130" r="3" fill="#FF1744"/>
  <circle cx="210" cy="85" r="2.5" fill="#00E676"/>
  <circle cx="105" cy="245" r="2.5" fill="#FFD54F"/>
</svg>
